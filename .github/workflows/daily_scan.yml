name: Daily Scan (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scan
        id: scan
        run: |
          set +e
          python run_daily_scan.py --out-dir output
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Fail on scan error
        if: steps.scan.outputs.exit_code != '0' && steps.scan.outputs.exit_code != '2'
        run: |
          echo "::error::デイリースキャンで内部エラーが発生しました。状態JSONを確認してください。"
          exit 1

      - name: Warn on incomplete business-day data
        if: steps.scan.outputs.exit_code == '2'
        run: echo "::warning::営業日のデータが揃わず完成版CSVを出しませんでした。状態JSONを確認してください。"

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
